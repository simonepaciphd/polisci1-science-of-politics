# POLISCI 1 weekly modules: the only content source for the site. Edit here, then run `python build.py`.
#
# Per week:
#   start     Monday of the week (YYYY-MM-DD); drives the dates shown and the "Jump to this week" button
#   title     the syllabus part(s) the week covers
#   sessions  class meetings, one line each
#   note      optional one-line note (holiday, exam)
#   readings, slides, homework
#             a link, either an absolute http(s) URL or a file path under materials/ (e.g. "materials/w01-slides.pdf");
#             leave "" until it is ready: the site shows "coming soon" (or "none this week" when the key is set to "none")
#
